server.port=8080

# Mevcut oto_yikama veritabani (XAMPP). Sifre bos.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/oto_yikama?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Europe/Istanbul
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Mevcut tablolari KORU: sadece eksik kolon/tablo eklenir, veri silinmez.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT
app.jwt.secret=${APP_JWT_SECRET:dev-only-insecure-local-secret-replace-in-production-0123456789abcdef0123456789}
app.jwt.expiration=86400000
